plugins {
    id 'net.fabricmc.fabric-loom' version "${loom_version}"
    id 'maven-publish'
}

version = "${project.mod_version}+mc26.1.2.yftm.${project.yftm_build}"
group = project.mod_group

base {
    archivesName = project.archives_base_name
}

repositories {
    mavenCentral()
    maven { url = 'https://maven.fabricmc.net/' }
    maven { url = 'https://api.modrinth.com/maven' }
    maven { url = 'https://dl.cloudsmith.io/public/geckolib3/geckolib/maven/' }
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    implementation "net.fabricmc:fabric-loader:${project.loader_version}"
    implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"
    implementation "maven.modrinth:geckolib:yUpAp23B"
    implementation "com.electronwill.night-config:toml:3.8.1"
    implementation "com.electronwill.night-config:core:3.8.1"
    include "com.electronwill.night-config:toml:3.8.1"
    include "com.electronwill.night-config:core:3.8.1"
    compileOnly files("${gradle.gradleUserHomeDir}/caches/fabric-loom/minecraftMaven/net/minecraft/minecraft-clientonly-deobf/${project.minecraft_version}/minecraft-clientonly-deobf-${project.minecraft_version}.jar")
    compileOnly "com.google.code.findbugs:jsr305:3.0.2"
}

loom {
    splitEnvironmentSourceSets()
    mods {
        jeg {
            sourceSet sourceSets.main
            sourceSet sourceSets.client
        }
    }
}

dependencies {
    // Not Enough Animations (in the yftm pack): compiled against for its animation API, used only when it is installed.
    clientCompileOnly "maven.modrinth:MPCX6s5C:K6FD58uq"
}

// Client game tests boot a real client: ./gradlew runClientGameTest (screenshots land in build/run/clientGameTest/screenshots).
fabricApi {
    configureTests {
        createSourceSet = true
        modId = "jeg-gametest"
        enableGameTests = false
        enableClientGameTests = true
        eula = true
    }
}

// Run only some client game tests: ./gradlew runClientGameTest -PgameTests=HelicopterStartup,VehiclePaint
// (class names, with or without the ClientGameTest suffix). Without it every test runs, except setup tasks that only run
// when named (HeliSandboxSetup builds the HeliTest play-test world).
tasks.named("processGametestResources") {
    def only = (project.findProperty("gameTests") ?: "").toString().trim()
    inputs.property("gameTests", only)
    doLast {
        def file = new File(destinationDir, "fabric.mod.json")
        def json = new groovy.json.JsonSlurper().parse(file)
        def all = json.entrypoints["fabric-client-gametest"]
        def wanted = only.split(",").collect { it.trim() }.findAll { !it.isEmpty() }
        def kept = only.isEmpty()
                ? all.findAll { !it.contains("Sandbox") }
                : all.findAll { entry -> wanted.any { entry.endsWith("." + it) || entry.endsWith("." + it + "ClientGameTest") } }
        if (kept.isEmpty()) {
            throw new GradleException("No client game test matches -PgameTests=" + only)
        }
        json.entrypoints["fabric-client-gametest"] = kept
        file.text = groovy.json.JsonOutput.prettyPrint(groovy.json.JsonOutput.toJson(json))
        logger.lifecycle("Client game tests: " + kept.collect { it.substring(it.lastIndexOf('.') + 1) }.join(", "))
    }
}

// Run client game tests inside the yftm pack's mods that touch what JEG does (rendering, player animation, chunk loading,
// explosions, inventory and input), at the pack's own versions, with the shader pack and Fresh Animations on:
// ./gradlew runClientGameTest -PgameTests=MinigunDualWield -PwithPack -Pminecraft_version=26.1.2 -Pfabric_version=0.155.3+26.1.2 -Ploader_version=0.20.1
// (the pack's loader; several of its mods need 0.19+).
// Leave some out to find which one causes a problem: -PpackExclude=immediatelyfast,lambdynamiclights
def withPack = project.hasProperty("withPack")
def packExclude = (project.findProperty("packExclude") ?: "").toString().split(",").collect { it.trim() }.findAll { !it.isEmpty() }
if (withPack) {
    def packMods = [
            // Rendering and LOD terrain.
            "voxy"                 : "maven.modrinth:fxxUqruK:Zt3LPI0b", // 0.2.18-beta
            "entityculling"        : "maven.modrinth:NNAgCjsB:VhQ51u7a", // 1.11.3
            "immediatelyfast"      : "maven.modrinth:5ZwdcRci:xOA9hbpf", // 1.15.3
            "visuality"            : "maven.modrinth:rI0hvYcd:rjaBaaYV", // 0.7.13
            "cloth-config"         : "maven.modrinth:9s6osm5g:GFM8zh9J", // 26.1.154
            "lambdynamiclights"    : "maven.modrinth:yBW8D80W:USlEyPPR", // 4.11.2
            // Player animation on top of EMF / Fresh Animations.
            "notenoughanimations"  : "maven.modrinth:MPCX6s5C:K6FD58uq", // 1.12.5
            "playeranimationlib"   : "maven.modrinth:ha1mEyJS:QmAdOGjK", // 1.2.8
            "emf-compat-core"      : "maven.modrinth:hbGct5uU:rpZfoieQ", // 2.3.2
            "emf-compat-nea"       : "maven.modrinth:IGCrWfL7:pgIoXdH0", // 1.2.1
            // Server: chunk system, ticking, explosions.
            "lithium"              : "maven.modrinth:gvQqBUqZ:Oqq8TOAV", // 0.24.7
            "c2me"                 : "maven.modrinth:VSNURh3q:to1sDRnG", // 0.4.0-alpha.0.65
            "ferritecore"          : "maven.modrinth:uXXizFIs:d5ddUdiB", // 9.0.0
            "modernfix"            : "maven.modrinth:TjSm1wrD:cTKaCklf", // 5.27.19
            "scalablelux"          : "maven.modrinth:Ps1zyz6x:ToW8oIIq", // 0.3.0-alpha.0.2
            "voxy-server-side"     : "maven.modrinth:84zcagOb:agN2JvPt",
            // Sound, inventory and input.
            "soundphysics"         : "maven.modrinth:qyVF9oeo:y3vsp51g", // 1.5.1
            "inventoryprofilesnext": "maven.modrinth:O7RBXm3n:lOBWkkzv", // 2.3.8
            "libipn"               : "maven.modrinth:onSQdWhM:94nbGWNs", // 6.9.0
            "tweakeroo"            : "maven.modrinth:t5wuYk45:2xHr441V", // 0.28.10
            "malilib"              : "maven.modrinth:GcWjdA9I:FItuNokS", // 0.28.12
            "carryon"              : "maven.modrinth:joEfVgkn:ISFd6ie5", // 2.10.0
    ]
    dependencies {
        packMods.each { name, coordinate ->
            if (!packExclude.contains(name)) {
                gametestRuntimeOnly coordinate
            }
        }
    }
}

// Run client game tests under Iris with the server pack's shader pack on, like players on yftm:
// ./gradlew runClientGameTest -PgameTests=GunMuzzleOrigin -PwithIris -Pminecraft_version=26.1.2 -Pfabric_version=0.155.3+26.1.2
// (Sodium 0.9 needs Fabric API 0.145.1+, which only exists for 26.1.2, the version the server runs.)
if (project.hasProperty("withIris") || (withPack && !packExclude.contains("iris"))) {
    dependencies {
        gametestRuntimeOnly "maven.modrinth:sodium:vf7UgZpC"
        gametestRuntimeOnly "maven.modrinth:iris:sZbVsl2Q"
    }
    def shaderPackName = "ComplementaryReimagined_r5.9.3.zip"
    def shaderPackUrl = "https://cdn.modrinth.com/data/HVnmMxH1/versions/Bqen1mJX/ComplementaryReimagined_r5.9.3.zip"
    tasks.named("runClientGameTest") {
        doFirst {
            def runDir = file("build/run/clientGameTest")
            def pack = new File(runDir, "shaderpacks/" + shaderPackName)
            if (!pack.exists()) {
                pack.parentFile.mkdirs()
                new URL(shaderPackUrl).withInputStream { input -> pack.withOutputStream { it << input } }
            }
            def config = new File(runDir, "config/iris.properties")
            config.parentFile.mkdirs()
            config.text = "enableShaders=true\nshaderPack=" + shaderPackName + "\n"
        }
    }
}

// Run client game tests with the yftm pack's Zoomify (zoom on C): ./gradlew runClientGameTest -PgameTests=ZoomifyZoom -PwithZoomify
if (project.hasProperty("withZoomify") || withPack) {
    dependencies {
        gametestRuntimeOnly "maven.modrinth:Ha28R6CL:SKW1BTL3" // Fabric Language Kotlin 1.14.2
        gametestRuntimeOnly "maven.modrinth:1eAoo2KR:IODousKT" // YetAnotherConfigLib 3.9.7
        gametestRuntimeOnly "maven.modrinth:w7ThoJFB:gwKcDOSy" // Zoomify 2.17.0
    }
}

// Run client game tests with the yftm pack's Fresh Animations resource packs and EMF/ETF, which re-animate the player:
// ./gradlew runClientGameTest -PgameTests=MinigunFreshAnimations -PwithFreshAnimations
if (project.hasProperty("withFreshAnimations") || withPack) {
    dependencies {
        gametestRuntimeOnly "maven.modrinth:BVzZfTc1:2bcqPrsv" // Entity Texture Features 7.2.6
        gametestRuntimeOnly "maven.modrinth:4I1XuqiY:zh2AVI88" // Entity Model Features 3.3.12
    }
    def packs = [
            "FreshAnimations_v1.10.5.zip": "https://cdn.modrinth.com/data/50dA9Sha/versions/RGIzA5em/FreshAnimations_v1.10.5.zip",
            "FA+All_Extensions-v1.9.2.zip": "https://cdn.modrinth.com/data/YAVTU8mK/versions/R5ZGSF8A/FA%2BAll_Extensions-v1.9.2.zip",
            "FA+Player-v1.1.zip"          : "https://cdn.modrinth.com/data/TAIMVZCL/versions/Wj7NeGjP/FA%2BPlayer-v1.1.zip"
    ]
    tasks.named("runClientGameTest") {
        doFirst {
            packs.each { name, url ->
                def pack = file("build/run/clientGameTest/resourcepacks/" + name)
                if (!pack.exists()) {
                    pack.parentFile.mkdirs()
                    new URL(url).withInputStream { input -> pack.withOutputStream { it << input } }
                }
            }
            if (withPack || project.hasProperty("withFreshAnimations")) {
                // With the whole pack the client starts with the packs switched on, as players have them, so every test
                // sees Fresh Animations' player model (the MinigunFreshAnimations test switches them on itself).
                def options = file("build/run/clientGameTest/options.txt")
                def enabled = "resourcePacks:[\"vanilla\",\"fabric\"," + packs.keySet().collect { "\"file/" + it + "\"" }.join(",") + "]"
                def lines = options.exists() ? options.readLines().findAll { !it.startsWith("resourcePacks:") } : []
                options.parentFile.mkdirs()
                options.text = (lines + enabled).join("\n") + "\n"
            }
        }
    }
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(25)
    withSourcesJar()
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 25
}

processResources {
    inputs.property "version", project.version
    inputs.property "minecraft_version_range", project.minecraft_version_range
    filesMatching("fabric.mod.json") {
        expand(
                "version": project.version,
                "minecraft_version_range": project.minecraft_version_range
        )
    }
}

publishing {
    publications {
        create("mavenJava", MavenPublication) {
            from components.java
        }
    }
}
